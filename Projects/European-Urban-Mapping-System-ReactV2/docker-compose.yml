networks:
  euro-network:
    driver: bridge

services:
  postgis:
    image: postgis/postgis:17-3.5
    container_name: euro-reactv2-postgis
    environment:
      POSTGRES_DB: european_mapping_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgis-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - euro-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  django:
    build: .
    container_name: euro-reactv2-django
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_db &&
             python manage.py collectstatic --noinput &&
             gunicorn european_mapping.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    environment:
      - DEBUG=True
      - DB_NAME=european_mapping_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=postgis
      - DB_PORT=5432
    volumes:
      - .:/app
      - staticfiles:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      postgis:
        condition: service_healthy
    networks:
      - euro-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: euro-reactv2-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: piercemooney7@gmail.com
      PGADMIN_DEFAULT_PASSWORD: piercemooney
    ports:
      - "5050:80"
    depends_on:
      - postgis
    networks:
      - euro-network
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  nginx:
    image: nginx:alpine
    container_name: euro-reactv2-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/app/frontend/dist:ro
      - staticfiles:/app/staticfiles:ro
    ports:
      - "80:80"
    depends_on:
      - django
    networks:
      - euro-network

volumes:
  postgis-data:
  pgadmin-data:
  staticfiles:
