all:
  children:
    # Network Infrastructure
    firewalls:
      hosts:
        fw-1:
          ansible_host: 192.168.56.3
          ansible_user: vagrant
          vrrp_priority: 100
          vrrp_state: MASTER
        fw-2:
          ansible_host: 192.168.56.2
          ansible_user: vagrant
          vrrp_priority: 90
          vrrp_state: BACKUP
      vars:
        firewall_virtual_ip: 192.168.56.3
        firewall_vrrp_id: 51
        firewall_vrrp_password: "1234"

    # Directory Services
    domain_controllers:
      hosts:
        dc-1:
          ansible_host: 192.168.56.10
          ansible_user: vagrant
          dc_role: PRIMARY
          samba_realm: SME.LOCAL
          samba_domain: SME
        dc-2:
          ansible_host: 192.168.56.11
          ansible_user: vagrant
          dc_role: SECONDARY
          samba_realm: SME.LOCAL
          samba_domain: SME
      vars:
        domain_admin_password: "Admin123!"
        dns_forwarder: "8.8.8.8"

    # File Services
    file_servers:
      hosts:
        filesrv-1:
          ansible_host: 192.168.56.20
          ansible_user: vagrant
          filesrv_role: PRIMARY
        filesrv-2:
          ansible_host: 192.168.56.21
          ansible_user: vagrant
          filesrv_role: SECONDARY
      vars:
        share_paths:
          - name: public
            path: /srv/shares/public
            permissions: "755"
            guest_ok: true
          - name: private
            path: /srv/shares/private
            permissions: "750"
            valid_users: "@SME\\Domain Users"
          - name: backup
            path: /srv/shares/backup
            permissions: "750"
            valid_users: "@SME\\Domain Admins"

    # Web Services
    web_servers:
      hosts:
        web-1:
          ansible_host: 192.168.56.30
          ansible_user: vagrant
          web_role: PRIMARY
        web-2:
          ansible_host: 192.168.56.31
          ansible_user: vagrant
          web_role: SECONDARY
      vars:
        web_document_root: /var/www/html
        web_admin_email: webmaster@sme.local
        php_modules:
          - php-mysql
          - php-curl
          - php-gd

    # Monitoring & Observability
    monitoring:
      hosts:  
        monitor-1:
          ansible_host: 192.168.56.40
          ansible_user: vagrant
      vars:
        prometheus_version: "2.45.0"
        grafana_admin_password: "admin"
        node_exporter_targets:
          - "192.168.56.10:9100"
          - "192.168.56.11:9100"
          - "192.168.56.20:9100"
          - "192.168.56.21:9100"
          - "192.168.56.30:9100"
          - "192.168.56.31:9100"

    logging:
      hosts:
        log-1:
          ansible_host: 192.168.56.41
          ansible_user: vagrant
      vars:
        elasticsearch_cluster_name: "sme-cluster"
        kibana_port: 5601
        logstash_syslog_port: 5140

    # Management & Administration
    management:
      hosts:
        mgmt-1:
          ansible_host: 192.168.56.50
          ansible_user: vagrant
          mgmt_role: PRIMARY
        mgmt-2:
          ansible_host: 192.168.56.51
          ansible_user: vagrant
          mgmt_role: SECONDARY
      vars:
        admin_user: sme-admin
        admin_password: "Admin123!"
        ansible_connection: ssh
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

    # Infrastructure Groups
    infrastructure:
      children:
        firewalls:
        domain_controllers:
        file_servers:
        web_servers:

    services:
      children:
        monitoring:
        logging:

    all_servers:
      children:
        infrastructure:
        services:
        management:

  vars:
    # Global variables
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
    # When running Ansible from mgmt-1 (e.g. sme-spinup deploy on Windows), use the SSH jump key
    # created by dc-1 bootstrap so mgmt-1 can SSH to all hosts. Key is in shared /vagrant.
    # sme-spinup deploy (Windows) copies key to this path before running; use it for manual runs from mgmt-1 too
    ansible_ssh_private_key_file: /home/vagrant/.ssh/sme_jump_key
    ansible_become: true
    ansible_become_method: sudo
    ansible_become_user: root
    
    # Network configuration
    network_domain: sme.local
    network_subnet: 192.168.56.0/24
    network_gateway: 192.168.56.1
    
    # Time configuration
    timezone: UTC
    ntp_servers:
      - "0.pool.ntp.org"
      - "1.pool.ntp.org"
    
    # Security configuration
    ssh_port: 22
    firewall_default_policy: deny
    allowed_ssh_hosts: "192.168.56.0/24"

    # User access from LAN (e.g. home Wi-Fi). Set to your LAN subnet so other laptops can reach
    # mgmt-1 (SSH), web app, Grafana, Kibana. Set to "" to disable.
    user_access_subnet: "192.168.1.0/24"

    # Optional: restrict SSH to control node (host machine) only. List of CIDRs, e.g. ["192.168.0.225/32"].
    # When set, SSH to management is allowed from these in addition to network_subnet and user_access_subnet.
    control_node_networks: [] 