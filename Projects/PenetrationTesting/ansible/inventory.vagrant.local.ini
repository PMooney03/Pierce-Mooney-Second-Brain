# Ansible inventory for Vagrant ansible_local provisioner
# Runs INSIDE each guest — use local connection, not SSH to lab IPs

[kali]
kali-attacker ansible_connection=local ansible_host=127.0.0.1 ansible_become=true ansible_become_method=sudo

[ubuntu_target]
ubuntu-target ansible_connection=local ansible_host=127.0.0.1 ansible_become=true ansible_become_method=sudo

[windows_server]
windows-server ansible_connection=local ansible_host=127.0.0.1 ansible_become=true ansible_become_method=sudo

[lab:children]
kali
ubuntu_target
windows_server
